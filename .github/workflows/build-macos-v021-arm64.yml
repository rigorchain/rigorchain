# Manual ARM64 build of RIGOR Wallet v0.2.1.
# Checks out one fixed source commit. Does not build Intel and does not publish a Release.
name: RIGOR v0.2.1 macOS ARM64

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact dependency-manifest child commit
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: rigor-macos-v021-arm64
  cancel-in-progress: false

jobs:
  arm64:
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SHA: 2e5b1fb08ba9a09434e67b1ce7724d174485b452
      EXPECTED_PARENT: c1368f6870dcbf92b30e959c813fb4a260dcd089
      EXPECTED_LOCK: 991163c6156d9e511eb37e5a8bdc768cfb7d482af17545b36e5d132b3cb81f9d
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "1"
      NONINTERACTIVE: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Accept only the manifest child commit
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "rigorchain/rigorchain"
          test "${INPUT_SHA}" = "${EXPECTED_SHA}"
          echo "SOURCE_INPUT_OK"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2e5b1fb08ba9a09434e67b1ce7724d174485b452
          fetch-depth: 2

      - name: Verify source identity and dependency manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          diff_names="$(git diff --name-only HEAD^ HEAD)"
          test "${diff_names}" = "tools/release/macos-v0.2.1/ARM64_DEPENDENCY_LOCK.md"
          lock="tools/release/macos-v0.2.1/ARM64_DEPENDENCY_LOCK.md"
          test -s "${lock}"
          got="$(shasum -a 256 "${lock}" | awk '{print $1}')"
          test "${got}" = "${EXPECTED_LOCK}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "SOURCE_PARENT=$(git rev-parse HEAD^)"
          echo "LOCK_SHA256=${got}"

      - name: Require a native macOS 15 ARM64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          product="$(sw_vers -productVersion)"
          echo "MACOS_PRODUCT=${product}"
          echo "${product}" | grep -Eq '^15([.]|$)'
          xcodebuild -version
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'
          python3 -c 'import shutil; raise SystemExit(0 if shutil.disk_usage("/").free >= 8 * 1024**3 else 1)'
          echo "PYTHON=$(python3 --version)"
          echo "BREW_PREFIX=$(brew --prefix)"

      - name: Install the pinned Homebrew bottles
        run: |
          set -euo pipefail
          pour() {
            local name="$1" pkgver="$2" tag="$3" sha="$4" url="$5"
            local repo token file got
            repo="${url#https://ghcr.io/v2/}"
            repo="${repo%%/blobs/*}"
            token="$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"], end="")')"
            mkdir -p "${RUNNER_TEMP}/bottles"
            file="${RUNNER_TEMP}/bottles/${name}--${pkgver}.${tag}.bottle.tar.gz"
            curl -fsSL \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.layer.v1.tar+gzip" \
              -o "${file}" \
              "${url}"
            got="$(shasum -a 256 "${file}" | awk '{print $1}')"
            rm -f "${file}"
            if [[ "${got}" != "${sha}" ]]; then
              echo "FAIL: ${name} sha256 mismatch" >&2
              exit 1
            fi
            echo "BOTTLE_SHA_OK ${name} ${pkgver}"
            python3 -c '
          import json, subprocess, sys
          name, pkgver, tag, sha = sys.argv[1:5]
          data = json.loads(subprocess.check_output(["brew", "info", "--json=v2", name], text=True))["formulae"][0]
          revision = int(data.get("revision") or 0)
          stable = data["versions"]["stable"]
          got_ver = stable if revision == 0 else f"{stable}_{revision}"
          got_sha = data["bottle"]["stable"]["files"][tag]["sha256"]
          if got_ver != pkgver or got_sha != sha:
              sys.stderr.write("FAIL: %s API bottle %s %s\n" % (name, got_ver, got_sha))
              sys.exit(1)
          print("BOTTLE_API_OK %s %s" % (name, got_ver))
            ' "${name}" "${pkgver}" "${tag}" "${sha}"
            if brew list --versions "${name}" 2>/dev/null | awk -v n="${name}" -v v="${pkgver}" '$1==n && $2==v { ok=1 } END { exit ok ? 0 : 1 }'; then
              echo "BOTTLE_PRESENT ${name} ${pkgver}"
              return 0
            fi
            if brew list --versions "${name}" >/dev/null 2>&1; then
              brew uninstall --ignore-dependencies "${name}"
            fi
            brew install --ignore-dependencies "${name}"
            brew list --versions "${name}" | awk -v n="${name}" -v v="${pkgver}" '$1==n && $2==v { ok=1 } END { exit ok ? 0 : 1 }'
            echo "BOTTLE_INSTALLED ${name} ${pkgver}"
          }
          while IFS=$'\t' read -r name pkgver tag sha url; do
            [[ -n "${name}" ]] || continue
            pour "${name}" "${pkgver}" "${tag}" "${sha}" "${url}"
          done <<'BOTTLES'
          m4	1.4.21	arm64_sequoia	80f871ba39104ef553d5a15e2c70639c69dd4fb76568842f5dc1ef451918c6a8	https://ghcr.io/v2/homebrew/core/m4/blobs/sha256:80f871ba39104ef553d5a15e2c70639c69dd4fb76568842f5dc1ef451918c6a8
          autoconf	2.73	arm64_sequoia	bc785e044f4bec3efa3e9875f154905dad8a249e6e57d2a3ab0250eebdc866e8	https://ghcr.io/v2/homebrew/core/autoconf/blobs/sha256:bc785e044f4bec3efa3e9875f154905dad8a249e6e57d2a3ab0250eebdc866e8
          automake	1.19	arm64_sequoia	23c091faee8dac047b0670d8c10da030bf104610fc064b904407de1a1ff8f437	https://ghcr.io/v2/homebrew/core/automake/blobs/sha256:23c091faee8dac047b0670d8c10da030bf104610fc064b904407de1a1ff8f437
