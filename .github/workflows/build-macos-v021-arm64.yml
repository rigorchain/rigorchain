          BOTTLES

      - name: Install the pinned Python wheels
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/wheels"
          curl -fsSL -o "${RUNNER_TEMP}/wheels/ds_store-1.3.3-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/66/c0/718a4132306ff8ff052f2c40595f45595993b480409400d55b07f3842d45/ds_store-1.3.3-py3-none-any.whl
          curl -fsSL -o "${RUNNER_TEMP}/wheels/mac_alias-2.2.3-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/13/20/103f4e4a6e8a524ea92eee7d938c6133d0b129aa999a50f8648ad126c728/mac_alias-2.2.3-py3-none-any.whl
          echo "b92a371efbf1b4ccce2a04d1ed13fceacc4736c81ba09cf5aefb74c088160a35  ${RUNNER_TEMP}/wheels/ds_store-1.3.3-py3-none-any.whl" | shasum -a 256 -c -
          echo "7362b521d2132ef92f606a37abfed5fcd849ceb2f28b6f9743e014b02af92f0d  ${RUNNER_TEMP}/wheels/mac_alias-2.2.3-py3-none-any.whl" | shasum -a 256 -c -
          python3 -m venv "${RUNNER_TEMP}/rigor-macos-dmg-venv"
          "${RUNNER_TEMP}/rigor-macos-dmg-venv/bin/pip" install --no-index --no-deps \
            "${RUNNER_TEMP}/wheels/ds_store-1.3.3-py3-none-any.whl" \
            "${RUNNER_TEMP}/wheels/mac_alias-2.2.3-py3-none-any.whl"
          "${RUNNER_TEMP}/rigor-macos-dmg-venv/bin/pip" freeze
          echo "RIGOR_MACOS_DMG_VENV=${RUNNER_TEMP}/rigor-macos-dmg-venv" >> "${GITHUB_ENV}"

      - name: Build the ARM64 wallet DMG
        run: |
          set -euo pipefail
          test -x "${RIGOR_MACOS_DMG_VENV}/bin/python3"
          bash tools/release/macos-v0.2.1/build-macos-wallet-dmg.sh
          dmg="dist/release/v0.2.1/macos-arm64/rigor-v0.2.1-macos-arm64.dmg"
          test -s "${dmg}"
          shasum -a 256 "${dmg}"
          echo "DMG_BYTES=$(wc -c < "${dmg}" | tr -d ' ')"

      - name: Inspect the application bundle
        run: |
          set -euo pipefail
          dmg="dist/release/v0.2.1/macos-arm64/rigor-v0.2.1-macos-arm64.dmg"
          mount="${RUNNER_TEMP}/rigor-dmg"
          mkdir -p "${mount}"
          hdiutil attach -readonly -nobrowse -mountpoint "${mount}" "${dmg}"
          app="$(find "${mount}" -name '*.app' -type d -maxdepth 3 | head -n 1)"
          test -n "${app}"
          echo "APP=${app##*/}"
          plutil -extract CFBundleIdentifier raw -o - "${app}/Contents/Info.plist"
          plutil -extract CFBundleShortVersionString raw -o - "${app}/Contents/Info.plist"
          plutil -extract LSMinimumSystemVersion raw -o - "${app}/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "${app}/Contents/Info.plist")" = "org.rigor.RigorQt"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "${app}/Contents/Info.plist")" = "0.2.1"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "${app}/Contents/Info.plist")" = "15.0.0"
          codesign -dv "${app}" 2>&1 | sed -n '1,20p'
          python3 - "${app}" <<'PY'
          import pathlib, subprocess, sys
          app = pathlib.Path(sys.argv[1])
          bad = 0
          seen = 0
          for path in app.rglob("*"):
              if not path.is_file() or path.is_symlink():
                  continue
              info = subprocess.run(["lipo", "-info", str(path)], text=True, capture_output=True)
              if info.returncode != 0:
                  continue
              text = (info.stdout + info.stderr).strip()
              seen += 1
              if "x86_64" in text or "Non-fat" not in text or "arm64" not in text:
                  print("ARCH_FAIL", path, text)
                  bad += 1
                  continue
              libs = subprocess.run(["otool", "-L", str(path)], text=True, capture_output=True, check=True).stdout
              for line in libs.splitlines():
                  if "/opt/homebrew" in line or "/usr/local/opt" in line:
                      print("LINK_FAIL", path, line.strip())
                      bad += 1
              load = subprocess.run(["otool", "-l", str(path)], text=True, capture_output=True, check=True).stdout
              minos = None
              lines = load.splitlines()
              for i, line in enumerate(lines):
                  if "LC_BUILD_VERSION" in line or "LC_VERSION_MIN_MACOSX" in line:
                      for nxt in lines[i:i+8]:
                          stripped = nxt.strip()
                          if stripped.startswith("minos ") or stripped.startswith("version "):
                              minos = stripped.split()[1]
                              break
                      if minos:
                          break
              if minos is None:
                  print("MINOS_FAIL missing", path)
                  bad += 1
                  continue
              parts = tuple(int(x) for x in minos.split("."))
              if parts > (15, 0, 0):
                  print("MINOS_FAIL", minos, path)
                  bad += 1
          print("MACHO_COUNT", seen)
          if seen == 0 or bad:
              sys.exit(1)
          PY
          hdiutil detach "${mount}"

      - name: Upload the DMG
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rigor-v0.2.1-macos-arm64
          path: dist/release/v0.2.1/macos-arm64/rigor-v0.2.1-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14
