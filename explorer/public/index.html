<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIGOR Explorer</title>
    <link rel="stylesheet" href="/compliance.css" />
    <link rel="stylesheet" href="/convergence-panel.css" />
    <link rel="stylesheet" href="/status-dashboard.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; background: #000; color: #fff; }
      .row { margin-top: 10px; }
      .muted { color: #bbb; font-size: 12px; }
      a { color: #fff; }
    </style>
    <script src="/explorer-routes.js"></script>
    <script src="/status.js"></script>
  </head>
  <body>
    <nav class="site-nav" id="nav" aria-label="Explorer">
      <a href="/">Home</a>
      <a href="/blocks">Blocks</a>
      <a href="/oru.html">ORU</a>
      <a href="/res.html">RES</a>
      <a href="/res-events.html">RES events</a>
      <a href="/address">Address</a>
      <a href="/search">Search</a>
    </nav>
    <h1>RIGOR Explorer</h1>
    <form class="home-search" method="get" action="/search">
      <p class="muted">SEARCH</p>
      <p>
        <input name="q" placeholder="block / tx / address / height" autocomplete="off" />
        <button type="submit">SEARCH</button>
      </p>
    </form>
    <div id="status-root" class="status-dashboard">Loading…</div>
    <script>
      ExplorerRoutes.installCanonicalLink();
      ExplorerRoutes.mountNav('nav');
      const ssrStatus = document.getElementById('status-root');
      if (!(ssrStatus && ssrStatus.getAttribute('data-ssr') === '1')) {
        StatusDashboard.load().catch((e) => {
          document.getElementById('status-root').textContent = 'Failed: ' + String(e);
        });
      }
      StatusDashboard.startAutoRefresh();
    </script>
    <script src="/compliance.js"></script>
  </body>
</html>
