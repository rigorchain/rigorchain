<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RES</title>
    <link rel="stylesheet" href="/compliance.css" />
    <link rel="stylesheet" href="/status-dashboard.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; background: #000; color: #fff; }
      .muted { color: #bbb; font-size: 12px; }
      a { color: #fff; }
      table { border-collapse: collapse; width: 100%; margin-top: 16px; }
      th, td { border: 1px solid #333; padding: 8px; font-size: 13px; }
      th { background: #111; text-align: left; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
      .res-history { margin-top: 16px; width: 100%; }
      .res-history h2 { font-size: 16px; margin: 0 0 8px; }
      .history-wrap { overflow-x: auto; }
      @media (max-width: 800px) {
        body { margin: 12px; }
      }
      .res-curve { width: 100%; height: 248px; display: block; margin: 8px 0; border: 1px solid #333; background: #0a0a0a; }
      .status-card .muted { margin: 0 0 8px; }
    </style>
    <script src="/explorer-routes.js"></script>
  </head>
  <body>
    <nav class="site-nav" id="nav" aria-label="Explorer">
      <a href="/">Home</a>
      <a href="/blocks">Blocks</a>
      <a href="/oru.html">ORU</a>
      <a href="/res.html">RES</a>
      <a href="/res-events.html">RES events</a>
      <a href="/address">Address</a>
      <a href="/search">Search</a>
    </nav>
    <h1>RES</h1>
    <p class="muted">Confirmed RES transfers on RIGOR mainnet. Mint and destruction events remain on the <a href="/res-events.html">RES events</a> page.</p>
    <div id="curves" class="status-dashboard">Loading schedule…</div>
    <div id="root" class="status-dashboard">Loading…</div>
    <script>
      ExplorerRoutes.installCanonicalLink();
      ExplorerRoutes.mountNav('nav');

      function esc(s) {
        return String(s ?? "—")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function row(k, v) { return "<dt>" + esc(k) + "</dt><dd>" + v + "</dd>"; }
      function card(title, rows) {
        return '<section class="status-card"><h2>' + esc(title) + "</h2><dl>" + rows.join("") + "</dl></section>";
      }
      function val(v) { return v == null || v === "" ? "—" : esc(v); }
      function isZeroHash(h) { return !h || /^0+$/.test(String(h)); }
      function txLinkShort(txid) {
        if (isZeroHash(txid)) return "—";
        const s = String(txid);
        const label = s.length < 20 ? s : s.slice(0, 12) + "…" + s.slice(-6);
        return '<a class="mono" href="' + ExplorerRoutes.txPath(txid) + '" title="' + esc(s) + '">' + esc(label) + "</a>";
      }
      function formatResAtoms(atoms) {
        try {
          const a = BigInt(String(atoms ?? 0));
          return (a / 100000000n) + "." + (a % 100000000n).toString().padStart(8, "0") + " RES";
        } catch {
          return "—";
        }
      }

      function party(kind, address) {
        if (kind === "multiple") return "Multiple inputs";
        if (kind === "address" && address) {
          return '<a class="mono" href="' + ExplorerRoutes.addressPath(address) + '">' + esc(address) + "</a>";
        }
        return "Unavailable";
      }
      function recipient(address) {
        if (!address) return "Unavailable";
        return '<a class="mono" href="' + ExplorerRoutes.addressPath(address) + '">' + esc(address) + "</a>";
      }

      function renderDetails(payload) {
        const overview = payload.overview || {};
        const transfers = payload.transfers || [];
        const rows = transfers.map(function (item) {
          const when = item.time == null ? "—" : new Date(item.time * 1000).toISOString().replace(".000Z", "Z");
          return "<tr><td>" + esc(item.height) + "</td><td>" + txLinkShort(item.txid) + "</td><td>" +
            party(item.sender_kind, item.sender_address) + "</td><td>" + recipient(item.recipient) + "</td><td>" +
            esc(item.amount_display || formatResAtoms(item.amount_atoms)) + "</td><td>" + esc(when) + "</td></tr>";
        }).join("");
        const page = payload.page || 1;
        const pages = payload.pages || 1;
        const pager = '<p class="muted">Page ' + esc(page) + " / " + esc(pages) + " · " + esc(payload.total || 0) + " transfers" +
          (payload.has_prev ? ' · <a href="/res.html?page=' + (page - 1) + '">Newer</a>' : "") +
          (payload.has_next ? ' · <a href="/res.html?page=' + (page + 1) + '">Older</a>' : "") + "</p>";
        document.getElementById("root").innerHTML =
          card("RES overview", [
            row("Asset", "RES"),
            row("Network", val(overview.network)),
            row("RES maximum supply", val(overview.max_supply_display)),
            row("RES minted", val(overview.minted_display)),
          ]) +
          '<p class="muted">Mint and destruction events are on the <a href="/res-events.html">RES events</a> page.</p>' +
          '<div class="res-history"><h2>RES Transfer History</h2>' + pager +
          '<div class="history-wrap"><table><thead><tr><th>Height</th><th>Transaction</th><th>From</th><th>To</th><th>Amount</th><th>Time</th></tr></thead><tbody>' +
          (rows || '<tr><td colspan="6" class="muted">No confirmed RES transfers on this chain yet.</td></tr>') +
          "</tbody></table></div>" + pager + "</div>";
      }

      async function loadPage() {
        const rootEl = document.getElementById("root");
        if (rootEl && rootEl.getAttribute("data-ssr") === "1") return;
        const params = new URLSearchParams(window.location.search);
        const page = params.get("page") || "1";
        const response = await ExplorerRoutes.fetchJson("/api/res/transfers?limit=50&page=" + encodeURIComponent(page), 15000);
        if (!response.ok) throw new Error("transfers HTTP " + response.status);
        renderDetails(await response.json());
      }
      loadPage().catch((e) => {
        const root = document.getElementById("root");
        if (root && root.getAttribute("data-ssr") !== "1") {
          root.textContent = "Failed: " + String(e);
        }
      });
    </script>
    <script src="/compliance.js"></script>
  </body>
</html>
