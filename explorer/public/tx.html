<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tx detail</title>
    <link rel="stylesheet" href="/compliance.css" />
    <link rel="stylesheet" href="/convergence-panel.css" />
    <link rel="stylesheet" href="/witness-panel.css" />
    <link rel="stylesheet" href="/converge-proof-panel.css" />
    <link rel="stylesheet" href="/lineage-graph.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; background: #000; color: #fff; }
      a { color: #fff; }
      .muted { color: #bbb; font-size: 12px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #333; padding: 8px; font-size: 13px; vertical-align: top; }
      th { background: #111; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
      .tag { padding: 2px 6px; border-radius: 4px; font-size: 12px; border: 1px solid #333; background: #111; color: #fff; }
      .tag-oru { background: #0a1520; border-color: #8cc8ff; }
      .tag-res { background: #0a1a0a; border-color: #8fdc5a; }
      .tx-kind-notice {
        margin: 12px 0 16px;
        padding: 10px 12px;
        border: 1px solid #c9a227;
        background: #1a1508;
        color: #f3e6b0;
        font-size: 14px;
        font-weight: 600;
      }
      .tx-kind-notice.mint {
        border-color: #8fdc5a;
        background: #0a1a0a;
        color: #c8f0a8;
      }
    </style>
    <script src="/explorer-routes.js"></script>
    <script src="/convergence-panel.js"></script>
    <script src="/witness-panel.js"></script>
    <script src="/converge-proof-panel.js"></script>
    <script src="/lineage-graph.js"></script>
  </head>
  <body>
    <nav class="site-nav" id="nav" aria-label="Explorer">
      <a href="/">Home</a>
      <a href="/blocks">Blocks</a>
      <a href="/oru.html">ORU</a>
      <a href="/res.html">RES</a>
      <a href="/res-events.html">RES events</a>
      <a href="/address">Address</a>
      <a href="/search">Search</a>
    </nav>
    <h1>Tx detail</h1>

    <div id="root">Loading...</div>

    <script>
      ExplorerRoutes.installCanonicalLink();
      ExplorerRoutes.mountNav('nav');

      function shortHash(h) {
        if (!h) return '';
        return String(h).slice(0, 12) + '…' + String(h).slice(-6);
      }

      function atomsToOru(amount_atoms) {
        const a = BigInt(String(amount_atoms));
        const base = 100000000n;
        const int = a / base;
        const frac = a % base;
        return `${int}.${frac.toString().padStart(8, '0')}`;
      }

      function atomsToRes(amount_atoms) {
        const a = BigInt(String(amount_atoms));
        const base = 100000000n;
        const int = a / base;
        const frac = a % base;
        return `${int}.${frac.toString().padStart(8, '0')}`;
      }

      async function load() {
        const txid = ExplorerRoutes.txid();
        if (!txid) {
          document.getElementById('root').textContent = 'Missing txid in URL.';
          return;
        }
        const r = await ExplorerRoutes.fetchJson('/api/tx/' + encodeURIComponent(txid));
        if (!r.ok) {
          document.getElementById('root').textContent = 'Transaction not found.';
          return;
        }
        const j = await r.json();
        const tx = j.tx;
        const sum = j.summary || {};
        const fee = sum.fee || {};
        const panel = j.convergence_panel;
        const witnessPanel = j.witness_panel;
        const convergeProofPanel = j.converge_proof_panel;
        const lineageGraph = j.lineage_graph;

        const vinRows = (j.vin || []).map((input) => {
          const kind = input.prev_asset_kind || "—";
          const atoms = input.prev_value_atoms;
          const valueStr = atoms == null ? "—" : (kind === "RES" ? atomsToRes(atoms) : (kind === "ORU" ? atomsToOru(atoms) : String(atoms)));
          const addr = input.prev_address ? `<a href="${ExplorerRoutes.addressPath(input.prev_address)}">${input.prev_address}</a>` : "—";
          const tagClass = kind === "RES" ? "tag-res" : (kind === "ORU" ? "tag-oru" : "");
          return `<tr><td>${input.vin_index ?? ""}</td><td><span class="tag ${tagClass}">${kind}</span></td><td>${valueStr}</td><td>${addr}</td></tr>`;
        }).join("");

        const voutRows = (j.vout || []).map((o) => {
          const tagClass = o.asset_kind === 'RES' ? 'tag-res' : (o.asset_kind === 'ORU' ? 'tag-oru' : '');
          const tag = o.asset_kind === 'RES' ? `RES` : (o.asset_kind === 'ORU' ? 'ORU' : o.asset_kind);
          const valueStr = o.asset_kind === 'RES' ? atomsToRes(o.value_atoms) : (o.asset_kind === 'ORU' ? atomsToOru(o.value_atoms) : '0');
          const isConverge = o.is_convergence === true || (typeof o.script_pubkey === 'string' && /^14[0-9a-f]{40}bd$/i.test(String(o.script_pubkey).replace(/\s+/g, '')));
          const outputNote = sum.converge_output_note
            || (sum.tx_kind === 'oru_destroy'
              ? 'OP_CONVERGE · ORU destroyed · no RES minted'
              : 'OP_CONVERGE / Unspendable destroy output');
          const convergeNote = isConverge
            ? ` <span class="muted">${outputNote}</span>`
            : '';
          const addrLink = o.address
            ? `<a href="${ExplorerRoutes.addressPath(o.address)}">${o.address}</a>${convergeNote}`
            : (isConverge
              ? `<span class="muted">${outputNote}</span>`
              : '');
          return `<tr>
            <td>${o.vout_index}</td>
            <td><span class="tag ${tagClass}">${tag}</span></td>
            <td>${valueStr}</td>
            <td>${addrLink}</td>
            <td class="mono">${o.program_hex ?? ''}</td>
          </tr>`;
        }).join('');

        const root = document.getElementById('root');
        root.innerHTML = `
          <section class="verify-independently-panel">
            <h2>Transaction</h2>
            <p class="mono">TXID: ${txid}</p>
            <p class="muted">Observational fingerprint: see the including block (not a consensus check).</p>
          </section>
          ${sum.kind_notice ? `<p class="tx-kind-notice${sum.tx_kind === 'res_mint' ? ' mint' : ''}">${sum.kind_notice}</p>` : ''}
          ${ConvergencePanel.renderTxPanel(panel, ExplorerRoutes)}
          ${witnessPanel ? WitnessPanel.renderWitnessPanel(witnessPanel, ExplorerRoutes) : ''}
          ${convergeProofPanel ? ConvergeProofPanel.renderConvergeProofPanel(convergeProofPanel, ExplorerRoutes) : ''}
          ${lineageGraph ? LineageGraph.renderLineagePanel(lineageGraph, ExplorerRoutes) : ''}

          <h2>Summary</h2>
          <table>
            <tbody>
              ${sum.tx_kind_label ? `<tr><th>Type</th><td>${sum.tx_kind_label}</td></tr>` : ''}
              <tr><th>Sender</th><td class="mono">${sum.sender ?? 'N/A'}</td></tr>
              <tr><th>${sum.amount_role === 'convergence_lock' ? 'OP_CONVERGE (Unspendable destroy output)' : 'Receiver'}</th><td class="mono">${sum.receiver ? `<a href="${ExplorerRoutes.addressPath(sum.receiver)}">${sum.receiver}</a>` : 'N/A'}</td></tr>
              <tr><th>${sum.is_coinbase ? 'Subsidy' : 'Amount'}</th><td>${sum.is_coinbase ? (sum.subsidy_display ?? sum.amount_display) : (sum.amount_display ?? 'N/A')}${!sum.is_coinbase && sum.amount_total_display && sum.amount_total_display !== sum.amount_display ? ` <span class="muted">(outputs total ${sum.amount_total_display})</span>` : ''}</td></tr>
              <tr><th>Fee</th><td>${fee.fee_display ?? 'N/A'}${fee.fee_kind === 'na' ? ' <span class="muted">ORU fee unavailable</span>' : ''}</td></tr>
            </tbody>
          </table>

          <h2>Header</h2>
          <pre class="mono">${JSON.stringify(tx, null, 2)}</pre>

          <h2>Inputs</h2>
          <table>
            <thead><tr><th>vin</th><th>asset</th><th>amount</th><th>address</th></tr></thead>
            <tbody>${vinRows}</tbody>
          </table>
          <pre class="mono">${JSON.stringify(j.vin || [], null, 2)}</pre>

          <h2>Outputs</h2>
          <table>
            <thead>
              <tr>
                <th>vout</th>
                <th>asset</th>
                <th>amount</th>
                <th>address</th>
                <th>program_hex</th>
              </tr>
            </thead>
            <tbody>${voutRows}</tbody>
          </table>

        `;
        ConvergencePanel.bindCopyButtons(root);
      }

      const ssrRoot = document.getElementById('root');
      if (ssrRoot && ssrRoot.getAttribute('data-ssr') === '1') {
        if (window.ConvergencePanel && ConvergencePanel.bindCopyButtons) ConvergencePanel.bindCopyButtons(ssrRoot);
      } else {
        load().catch((e) => {
          const msg = e && e.name === 'AbortError' ? 'Timed out loading transaction. Is the explorer API reachable?' : String(e);
          document.getElementById('root').textContent = 'Failed: ' + msg;
        });
      }
    </script>
    <script src="/compliance.js"></script>
  </body>
</html>
