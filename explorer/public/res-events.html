<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RES events</title>
    <link rel="stylesheet" href="/compliance.css" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; background: #000; color: #fff; }
      a { color: #fff; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #333; padding: 8px; font-size: 13px; vertical-align: top; }
      th { background: #111; text-align: left; }
      .muted { color: #bbb; font-size: 12px; }
    </style>
    <script src="/explorer-routes.js"></script>
  </head>
  <body>
    <nav class="site-nav" id="nav" aria-label="Explorer">
      <a href="/">Home</a>
      <a href="/blocks">Blocks</a>
      <a href="/oru.html">ORU</a>
      <a href="/res.html">RES</a>
      <a href="/res-events.html">RES events</a>
      <a href="/address">Address</a>
      <a href="/search">Search</a>
    </nav>
    <h1>RES events</h1>
    <p class="muted">RES events display protocol-defined reserve operations. Each event records transparent ORU destruction and corresponding RES creation according to consensus rules. Confirmed RES transfers are listed on the <a href="/res.html">RES</a> page.</p>
    <div id="root">Loading...</div>
    <script>
      ExplorerRoutes.installCanonicalLink();
      ExplorerRoutes.mountNav('nav');

      function shortHash(h) {
        if (!h) return '';
        h = String(h);
        return h.slice(0, 12) + '…' + h.slice(-6);
      }
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      async function load() {
        const r = await fetch('/api/res/events?limit=200');
        const j = await r.json();
        const events = j.events || [];

        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr>
              <th>height</th>
              <th>destroy</th>
              <th>mint</th>
              <th>event</th>
              <th>result</th>
            </tr>
          </thead>
        `;

        const tbody = document.createElement('tbody');
        if (events.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5" class="muted">No OP_CONVERGE transactions indexed yet.</td>';
          tbody.appendChild(tr);
        }
        for (const e of events) {
          const tr = document.createElement('tr');
          const event = '<a href="' + ExplorerRoutes.txPath(e.convergence_txid) + '">' + esc(shortHash(e.convergence_txid)) + "</a>";
          tr.innerHTML =
            "<td>" + esc(e.height ?? e.included_height ?? "—") + "</td>" +
            "<td>" + esc(e.lock_display ?? "—") + "</td>" +
            "<td>" + esc(e.mint_amount ?? "—") + "</td>" +
            "<td>" + event + "</td>" +
            "<td>" + esc(e.result ?? "No RES") + "</td>";
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);

        const root = document.getElementById('root');
        root.innerHTML = "";
        root.appendChild(table);
      }
      load().catch((e) => {
        document.getElementById('root').textContent = 'Failed: ' + String(e);
      });
    </script>
    <script src="/compliance.js"></script>
  </body>
</html>
